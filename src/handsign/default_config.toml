# handsign configuration.
#
# Poses:  open_palm four three peace rock point call thumbs_up thumbs_down fist ok pinch
# Swipes: swipe_left swipe_right swipe_up swipe_down   (directions as you see them)
# A swipe can be restricted to a pose: "open_palm+swipe_left". The most specific binding wins.
#
# Run `handsign run --preview` to see what is detected while tuning.

[camera]
device = 0          # index, or a path such as "/dev/video2"
width = 640
height = 480
fps = 30
mirror = true       # selfie view: moving your hand right is a swipe_right

[recognition]
max_hands = 1
min_confidence = 0.6
hold_ms = 400       # how long a pose must be held before it fires
max_pose_speed = 2.5  # ignore poses while the hand moves faster than this (hand sizes / s)

# Classifier thresholds; see src/handsign/poses.py for what they mean.
# [recognition.thresholds]
# finger_reach = 1.3
# thumb_out = 1.1
# thumb_tucked = 0.8
# pinch_distance = 0.25

[motion]
enabled = true
min_distance = 1.5  # swipe length in hand sizes
window_ms = 400
cooldown_ms = 700

# Gestures are ignored until the arming pose has been held. Every gesture renews the timeout.
[arming]
enabled = true
pose = "open_palm"
hold_ms = 600
timeout_s = 5
disarm_pose = "fist"   # "" to disable

# With no hand in view the camera is polled at a low rate to save power.
[idle]
after_s = 5
fps = 5

[feedback]
notify = true            # desktop notification when armed / disarmed
notify_gestures = false  # ... and for every gesture that fires

# --- Bindings --------------------------------------------------------------------------------
# action types:
#   { type = "command",  argv = ["prog", "arg"] }   or   { type = "command", shell = "a | b" }
#       add detach = true to launch an application: commands are otherwise waited for and
#       killed after 15 s
#   { type = "hyprland", dispatch = 'hl.dsp.focus({ workspace = "e+1" })' }   (Lua, Hyprland 0.55+)
#   { type = "hyprland", dispatch = "workspace e+1" }                          (older Hyprland)
#   { type = "keys",     combo = "ctrl+alt+Right" } or   { type = "keys", sequence = ["ctrl+k", "s"] }
# optional per binding: hand = "left" | "right", hold_ms, repeat_ms (fire again while held),
#                       cooldown_ms (default 500)
